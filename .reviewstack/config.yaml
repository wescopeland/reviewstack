reviewers:
  - id: claude-aesthetic
    command: claude
    args:
      - --print
      - --permission-mode
      - dontAsk
      - >-
        /aesthetic-review Review {{target_description}} using the Reviewstack inputs. Ignore any empty
        local git diff from the slash-command context; the captured diff is the source of truth.
        Read {{inputs}}/context.json, {{inputs}}/diff.patch, and {{inputs}}/diff-stat.txt, then write
        a markdown review to stdout with findings, severity, concrete fixes, and file/line references
        where possible.

  - id: claude-analytical
    command: claude
    args:
      - --print
      - --permission-mode
      - dontAsk
      - >-
        /analytical-review Review {{target_description}} using the Reviewstack inputs. Ignore any empty
        local git diff from the slash-command context; the captured diff is the source of truth.
        Read {{inputs}}/context.json, {{inputs}}/diff.patch, and {{inputs}}/diff-stat.txt, then write
        a markdown review to stdout with findings, severity, concrete fixes, and file/line references
        where possible.

  - id: codex-medium
    command: codex
    args:
      - review
      - "{{review_target_flags}}"
      - -c
      - model="gpt-5.5"
      - -c
      - model_reasoning_effort="medium"
      - -c
      - service_tier="fast"
      - >-
        Review the changes in {{inputs}}/diff.patch using context from {{inputs}}/context.json
        and stats from {{inputs}}/diff-stat.txt. Write a markdown review to stdout with findings,
        severity, and concrete fixes.

  - id: codex-xhigh
    command: codex
    args:
      - review
      - "{{review_target_flags}}"
      - -c
      - model="gpt-5.5"
      - -c
      - model_reasoning_effort="xhigh"
      - -c
      - service_tier="fast"
      - >-
        Review the changes in {{inputs}}/diff.patch using context from {{inputs}}/context.json
        and stats from {{inputs}}/diff-stat.txt. Write a markdown review to stdout with findings,
        severity, and concrete fixes.

  - id: claude-thermo
    command: claude
    args:
      - --print
      - --permission-mode
      - dontAsk
      - --model
      - opus
      - --output-format
      - text
      - >-
        Thermonuclear maintainability review of {{target_description}}.
        Read {{inputs}}/diff.patch, {{inputs}}/context.json, and {{inputs}}/diff-stat.txt.
        Focus on coupling, abstraction depth, naming, and long-term maintainability.
        Write a markdown review to stdout with findings, severity, and concrete fixes.

synthesis:
  command: codex
  args:
    - exec
    - --dangerously-bypass-approvals-and-sandbox
    - -C
    - "{{workspace}}"
    - -o
    - "{{final}}"
    - -c
    - model="gpt-5.5"
    - -c
    - model_reasoning_effort="medium"
    - -c
    - service_tier="fast"
    - "-"
