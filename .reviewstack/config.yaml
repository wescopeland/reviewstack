reviewers:
  - id: claude-aesthetic
    command: claude
    args:
      - --print
      - --permission-mode
      - dontAsk
      - /aesthetic-review
      - "{{pr}}"

  - id: claude-analytical
    command: claude
    args:
      - --print
      - --permission-mode
      - dontAsk
      - /analytical-review
      - "{{pr}}"

  - id: codex-medium
    command: codex
    args:
      - review
      - >-
        Review the changes in {{inputs}}/diff.patch using context from {{inputs}}/context.json
        and stats from {{inputs}}/diff-stat.txt. Write a markdown review to stdout with findings,
        severity, and concrete fixes.
      - -c
      - model="gpt-5.5"
      - -c
      - model_reasoning_effort="medium"
      - -c
      - service_tier="fast"

  - id: codex-xhigh
    command: codex
    args:
      - review
      - >-
        Review the changes in {{inputs}}/diff.patch using context from {{inputs}}/context.json
        and stats from {{inputs}}/diff-stat.txt. Write a markdown review to stdout with findings,
        severity, and concrete fixes.
      - -c
      - model="gpt-5.5"
      - -c
      - model_reasoning_effort="xhigh"
      - -c
      - service_tier="fast"

  - id: cursor-thermo
    command: cursor-agent
    args:
      - --print
      - --trust
      - --force
      - --model
      - composer-2.5-fast
      - --output-format
      - text
      - >-
        Thermonuclear maintainability review of uncommitted/local changes.
        Read {{inputs}}/diff.patch, {{inputs}}/context.json, and {{inputs}}/diff-stat.txt.
        Focus on coupling, abstraction depth, naming, and long-term maintainability.
        Write a markdown review to stdout with findings, severity, and concrete fixes.

synthesis:
  command: codex
  args:
    - exec
    - --dangerously-bypass-approvals-and-sandbox
    - -C
    - "{{workspace}}"
    - -o
    - "{{final}}"
    - -c
    - model="gpt-5.5"
    - -c
    - model_reasoning_effort="medium"
    - -c
    - service_tier="fast"
    - "-"
